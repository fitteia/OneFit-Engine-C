name: CI

# Every pull request and push to main, and once a week: the tests
# inside Debian containers - trixie (stable, must pass) and forky (testing,
# the next stable: allowed to fail, an early warning of what the next Debian
# release will change; the weekly run catches it moving between pushes).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (debian ${{ matrix.debian }})
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.debian }}
    continue-on-error: ${{ matrix.debian == 'forky' }}
    strategy:
      fail-fast: false
      matrix:
        debian: [trixie, forky]
    steps:
      # git first, so actions/checkout makes a real git checkout
      - name: Debian packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates \
            gcc gfortran make perl libperl-dev swig

      - uses: actions/checkout@v4

      - name: Build and install the core
        run: make ARCH="$(uname -m)" OS=LINUX ROOT="$RUNNER_TEMP/root" install

      # extensions/api/engine tool tests and api-check (LIBNUMBER vs. the
      # installed headers' API, README.md "Version")
      - name: make test
        run: make test

      - name: Numerical routines (the Numerical Recipes replacements)
        run: bash local/tests/numerical-recipes/run_polint_compare.sh
